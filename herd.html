<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herd · Flock Yeah · Lone Tree Acres Horses</title>
  <meta name="description" content="Meet the Lone Tree Acres herd — Lincoln, Grace, Winchester, and Tia — neighbors to the Flock Yeah hens.">
  <link rel="stylesheet" href="css/hens.css">
</head>
<body class="has-merch-bg" data-lineup="horses">
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">Flock <span>Yeah</span></div>
      <div class="brand-tag" id="brand-tagline">Keep flocks for the birds. — Mom</div>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="hens.html">Cams</a>
      <a href="whos-who.html">Who's Who</a>
      <a href="herd.html" aria-current="page">Herd</a>
      <a href="shop.html">Shop</a>
      <a href="https://solforge.lonetreeacres.com" target="_blank" rel="noopener noreferrer">SolForge</a>
      <a href="https://www.lonetreeacres.com" target="_blank" rel="noopener noreferrer">Lone Tree Acres</a>
    </nav>
  </header>

  <main class="wrap lineup-page">
    <section class="hero-strip">
      <div class="live-pill">Pasture neighbors</div>
      <h1>The herd</h1>
      <p>Lincoln, Grace, Winchester, and Tia — boarding neighbors to the hens.</p>
    </section>

    <section class="lineup-board" aria-label="Horse jail lineup">
      <div class="lineup-row" id="lineup-row"></div>
    </section>

    <section class="lens-layout">
      <div class="panel">
        <h2>Lens</h2>
        <div class="lens-view" id="lens-view" title="Move pointer to pan">
          <img class="lens-subject" src="assets/horses/lincoln.svg" alt="">
        </div>
        <div class="lens-controls">
          <label for="lens-zoom">Zoom</label>
          <input id="lens-zoom" type="range" min="100" max="250" value="135">
        </div>
      </div>
      <div class="panel" id="lens-meta">
        <h2>Select a horse</h2>
      </div>
    </section>

    <section class="card-grid" id="herd-grid" aria-label="Horse cards" style="padding-top:0"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Boarding &amp; rehab · <a href="https://www.lonetreeacres.com" target="_blank" rel="noopener noreferrer">lonetreeacres.com</a> ·
      Jeff Lay · Longmont, CO
    </div>
  </footer>

  <script src="js/flock-roster.generated.js?v=flock31"></script>
  <script src="js/flock-data.js?v=flock31"></script>
  <script src="js/lineup.js"></script>
  <script>
    (function () {
      var grid = document.getElementById("herd-grid");
      if (!grid) return;
      grid.innerHTML = FlockData.HORSES.map(function (h) {
        return (
          '<article class="herd-card">' +
          '<img src="' + h.photo + '" alt="' + h.name + '">' +
          "<h3>" + h.name + "</h3>" +
          "<p><strong>" + h.role + "</strong></p>" +
          "<p>" + h.note + "</p>" +
          "</article>"
        );
      }).join("");
    })();
  </script>
</body>
</html>
