<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">Flock <span>Yeah</span></div>
      <div class="brand-tag" id="brand-tagline">Keep flocks for the birds. — Mom</div>

    <nav class="nav" aria-label="Primary">

    <section class="hero-strip">
      <div class="live-pill">Mugshot unit</div>
      <h1>Who's Who — jail lineup</h1>
      <p>Pick a hen. Twist the lens. Learn the charges (usually: theft of snacks, unauthorized dust baths).</p>

    <section class="lineup-board" aria-label="Hen jail lineup">
      <div class="lineup-row" id="lineup-row"></div>
