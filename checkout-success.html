<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks · Flock Yeah Checkout</title>
  <meta name="description" content="Flock Yeah checkout success — thanks for supporting Lone Tree Acres.">
  <link rel="stylesheet" href="css/hens.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">Flock <span>Yeah</span></div>
      <div class="brand-tag">Keep flocks for the birds. — Mom</div>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="hens.html">Cams</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel success-box">
      <div class="live-pill" style="margin:0 auto 1rem">Order noted</div>
      <h1>Yeah. The flock thanks you.</h1>
      <p id="success-detail">
        Your support keeps cameras warm, nests soft, and Clucky employed (sort of).
      </p>
      <p class="muted" id="success-next">
        Head back to cams — Clucky will announce it in chat.
      </p>
      <div class="btn-row" style="justify-content:center;margin-top:1.25rem">
        <a class="btn btn-primary" id="back-cams" href="hens.html">Back to cams · hear Clucky</a>
        <a class="btn" href="shop.html">More shop</a>
      </div>
    </section>
  </main>

  <script src="js/flock-data.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var item = params.get("item");
      var demo = params.get("demo");
      var kind = params.get("kind") || "order";
      var hen = params.get("hen") || "";
      var nameParam = params.get("name") || "";
      var el = document.getElementById("success-detail");
      var found = item && FlockData.SHOP_ITEMS.find(function (i) { return i.id === item; });
      var gift = item && FlockData.GIFTS.find(function (g) { return g.id === item; });
      var last = null;
      try { last = JSON.parse(sessionStorage.getItem("fy_last_order") || "null"); } catch (e) {}

      var displayName =
        nameParam ||
        (gift ? gift.emoji + " " + gift.name : "") ||
        (found ? found.name : "") ||
        (last && last.name) ||
        "Your support";

      if (gift || found || last || nameParam) {
        var treatNote = "";
        if (gift && gift.dispense) {
          treatNote =
            " Treat Pi placeholder queued (" +
            gift.dispense +
            ") — auto-dispense when the Zero is hooked up.";
        }
        el.textContent =
          (demo === "1" ? "Demo checkout for " : "Paid / queued: ") +
          displayName +
          ". Clucky will announce it when you return to cams." +
          treatNote;
      }

      var pending = {
        kind: kind,
        name: displayName,
        henId: hen || (last && last.henId) || "",
        giftId: gift ? gift.id : "",
        demo: demo === "1" || !!(last && last.demo),
      };
      try {
        sessionStorage.setItem("fy_pending_announce_v1", JSON.stringify(pending));
      } catch (e) {}

      var back = document.getElementById("back-cams");
      if (back) {
        var u = new URL("hens.html", location.href);
        u.searchParams.set("thanks", "1");
        u.searchParams.set("kind", pending.kind);
        u.searchParams.set("name", pending.name);
        if (pending.henId) u.searchParams.set("hen", pending.henId);
        if (pending.giftId) u.searchParams.set("gift", pending.giftId);
        if (pending.demo) u.searchParams.set("demo", "1");
        back.href = u.toString();
      }
    })();
  </script>
</body>
</html>
